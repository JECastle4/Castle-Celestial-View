# Castle Celestial View — nginx Configuration
# Production server configuration for reverse proxy and static file serving
# with comprehensive security headers
#
# Installation:
#   sudo cp scripts/castle-celestial.nginx.conf /etc/nginx/sites-available/castle-celestial
#   sudo ln -s /etc/nginx/sites-available/castle-celestial /etc/nginx/sites-enabled/castle-celestial
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# NOTE: This configuration includes TLS settings for Let's Encrypt certificates.
# If you have different certificate paths, update the ssl_certificate lines.
# The upstream gunicorn connection uses direct IP (127.0.0.1:8000) and doesn't require
# upstream block definition at the http level.

# HTTPS Server Block with Security Headers
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    
    # Domain configuration
    server_name castlecelestialview.net www.castlecelestialview.net;
    
    # TLS Certificates (Let's Encrypt via Certbot)
    # Update these paths if your certificates are in a different location
    ssl_certificate /etc/letsencrypt/live/castlecelestialview.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/castlecelestialview.net/privkey.pem;
    
    # Let's Encrypt DH parameters
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    
    # Additional TLS hardening (modern ciphers only, if not already set by options-ssl-nginx.conf)
    # Note: options-ssl-nginx.conf already sets ssl_protocols and ssl_ciphers, so we only add OCSP stapling
    
    # OCSP Stapling (optional - file created by certbot after first run)
    ssl_stapling on;
    ssl_stapling_verify on;
    # ssl_stapling_file /etc/letsencrypt/live/castlecelestialview.net/stapling.ocsp;  # Generated by certbot
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;
    
    # ─── Security Headers ─────────────────────────────────────────────────────
    # Apply to all responses (server block level, not location-specific)
    
    # HSTS (HTTP Strict-Transport-Security)
    # Forces HTTPS for all future connections (1 year, includes subdomains, preload)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    
    # CSP (Content-Security-Policy)
    # Restricts resources to same-origin only, prevents XSS attacks
    # frame-ancestors 'none' prevents embedding in iframes
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    
    # X-Frame-Options (Clickjacking Protection)
    add_header X-Frame-Options "DENY" always;
    
    # X-Content-Type-Options (MIME Sniffing Prevention)
    add_header X-Content-Type-Options "nosniff" always;
    
    # Referrer-Policy (Referrer Information Control)
    add_header Referrer-Policy "strict-no-referrer" always;
    
    # Permissions-Policy (Feature Control / Feature Policy)
    # Disable access to browser features for this site and embedded content
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), accelerometer=(), gyroscope=(), magnetometer=(), usb=(), vr=()" always;
    
    # Remove Server header to avoid information disclosure
    server_tokens off;
    
    # ─── Logging ───────────────────────────────────────────────────────────────
    access_log /var/log/nginx/castle-celestial-access.log combined buffer=32k flush=5s;
    error_log /var/log/nginx/castle-celestial-error.log warn;
    
    # ─── Request Size Limits ───────────────────────────────────────────────────
    # Limit request body to 5 MB (matches API middleware)
    client_max_body_size 5M;
    
    # ─── Static Files (Frontend) ───────────────────────────────────────────────
    root /home/deployuser/dist;
    index index.html;
    
    location / {
        try_files $uri $uri/ /index.html;
        
        # Security headers for static content
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), accelerometer=(), gyroscope=(), magnetometer=(), usb=(), vr=()" always;
        
        # Cache index.html with short TTL
        location = /index.html {
            add_header Cache-Control "public, max-age=3600, must-revalidate" always;
            # Security headers
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-no-referrer" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), accelerometer=(), gyroscope=(), magnetometer=(), usb=(), vr=()" always;
        }
    }
    
    # Cache fingerprinted assets long-term
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    
    # ─── API Reverse Proxy ─────────────────────────────────────────────────────
    # Forward API requests to gunicorn backend on localhost:8000
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        
        # Preserve client information for logging and security
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        
        # Security headers for API responses
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), accelerometer=(), gyroscope=(), magnetometer=(), usb=(), vr=()" always;
    }
    
    # ─── Health Check Endpoint ────────────────────────────────────────────────
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
        access_log off;  # Don't log health checks
    }
}

# ─── HTTP to HTTPS Redirect ───────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name castlecelestialview.net www.castlecelestialview.net;
    return 301 https://castlecelestialview.net$request_uri;
}

# ─── Catch-all for Unmapped Hosts (Security: Deny by Default) ────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    
    ssl_certificate /etc/letsencrypt/live/castlecelestialview.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/castlecelestialview.net/privkey.pem;
    
    server_name _;
    return 444;  # Close connection without response
}
